name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  red:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: services/red
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pyyaml pytest
      - run: python -m pytest -q
      - name: Offline self-improvement demo
        run: python demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: red-demo-report-py${{ matrix.python-version }}
          path: services/red/runs/demo_report.html

  blue:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/blue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q
        env:
          GCP_PROJECT: local

  green:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/green
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/green/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
